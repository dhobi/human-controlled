name: Tests

# The rules against fixed examples: offline, a few seconds, on every pull
# request and every push to main
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check human-controlled.mjs
      - run: node --test test/*.test.mjs
